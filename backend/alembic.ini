# Alembic migration config
# Docs: https://alembic.sqlalchemy.org/
# NOTE: file must remain pure ASCII -- configparser uses locale encoding when
# C/POSIX locale is active (e.g. minimal Docker images), so non-ASCII bytes
# here will raise UnicodeDecodeError on `alembic upgrade head`.

[alembic]
# DB URL (env.py overrides at runtime from settings.database_url for prod)
sqlalchemy.url = postgresql+asyncpg://aipm:password@localhost/aipm_db

script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

# Add backend/ to sys.path so env.py can `import app.models`.
# Otherwise CI runs without PYTHONPATH=. would fail with ModuleNotFoundError.
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
