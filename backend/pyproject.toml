# backend/pyproject.toml — 工具配置(依赖仍由 requirements.txt 管理)
#
# Stage 4 引入:ruff / mypy / pytest 配置统一在这里。

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    ".venv311",
    "_archive",
    "alembic/versions",  # 自动生成的迁移文件,不参与 lint
]

[tool.ruff.lint]
# 初期保守:只开 E(pycodestyle)、F(pyflakes)、W(warnings)、I(import 排序)
# 待 Stage 1 后续子任务再逐步加 B/UP/SIM 等
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — 交给 formatter,且历史代码 long line 较多
    # ──── 项目级合法用法,永久 ignore ────────────────────────────────────
    # SQLAlchemy WHERE 子句必须用 == True / == False 才能生成正确 SQL,
    # `if User.is_active:` 会被 Column 对象的 __bool__ 求值为永真,
    # 这不是代码风格问题,而是 ORM 的 query 语义。保留 ignore。
    "E712",
    # bare-except 仅在 tests/test_e2e_ipd.py 伪 e2e 脚本里使用,
    # 该文件已在 CI pytest --ignore 列表,且本身就是 Stage 1 待重构,
    # 顺便豁免 E722 避免后续 review 时杂音。
    "E722",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]                # alembic 需要 sys.path 注入后再 import
"app/main.py" = ["E402"]                   # 路由分块注册的懒 import 风格,Stage 1 重构后移除
"app/routers/auth.py" = ["E402"]           # 开头有初始化代码块后再 import,历史风格
"app/services/llm_selector.py" = ["E402"]  # 开头有 yaml registry 加载块
"app/services/wechat_api.py" = ["E402"]    # 开头有 access_token 内存缓存初始化块
"app/models/__init__.py" = ["F401"]        # __init__.py 的 re-export 是有意为之
"app/routers/__init__.py" = ["F401"]
"app/services/__init__.py" = ["F401"]
"tests/*" = ["F401", "E402"]               # 测试里允许局部 import + 灵活

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false       # 初期不要求 type hint 全覆盖
warn_unused_ignores = true
warn_redundant_casts = true
# V2.5 Stage 1 大扫除 #4:已装 stub 的 third-party 库报 import-untyped 时整体豁免
# (yaml / dingtalk-sdk 等;装 types-PyYAML 也可解,但生产 runtime 不依赖类型)
disable_error_code = ["import-untyped"]
exclude = [
    "\\.venv",
    "\\.venv311",
    "alembic",
    "tests",
    "_archive",
    "scripts",                    # 一次性 seed / admin 脚本,不属生产代码
]

# ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]              # 之后跑 pytest 不需要再写 PYTHONPATH=.
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:crypt.*",
]
