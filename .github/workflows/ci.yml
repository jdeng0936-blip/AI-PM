name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aipm
          POSTGRES_PASSWORD: aipm
          POSTGRES_DB: aipm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AIPM_ENV: dev
      DATABASE_URL: postgresql+asyncpg://aipm:aipm@localhost:5432/aipm_db
      DATABASE_URL_TEST: postgresql+asyncpg://aipm:aipm@localhost:5432/aipm_db_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-only-not-secret
      CI_REQUIRE_TEST_DB: "1"
      ASR_PROVIDER: none
      NEW_API_BASE_URL: ""
      NEW_API_KEY: ""
      WECHAT_BOT_WEBHOOK: ""
      DINGTALK_BOT_WEBHOOK: ""
      DINGTALK_BOT_SECRET: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create test database
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              for attempt in range(30):
                  try:
                      conn = await asyncpg.connect(
                          user="aipm",
                          password="aipm",
                          database="aipm_db",
                          host="localhost",
                          port=5432,
                      )
                      break
                  except OSError:
                      if attempt == 29:
                          raise
                      await asyncio.sleep(1)
              else:
                  raise RuntimeError("Postgres did not become ready")

              exists = await conn.fetchval(
                  "SELECT 1 FROM pg_database WHERE datname = 'aipm_db_test'"
              )
              if not exists:
                  await conn.execute("CREATE DATABASE aipm_db_test OWNER aipm")
              await conn.close()

          asyncio.run(main())
          PY

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Alembic schema check
        run: alembic check

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: ci
      SENTRY_TRACES_SAMPLE_RATE: "0"

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Next build
        run: npm run build
